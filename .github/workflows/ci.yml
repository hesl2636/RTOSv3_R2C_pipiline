name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.19'
          - os: ubuntu-24.04
            node: '24'
          - os: windows-2025
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Sample bundle is reproducible
        run: node scripts/build-bundle.mjs examples/rtosv3/bundle --check
      - name: Release contract check
        run: node scripts/release.mjs --check
      - name: Tracked bundle artifact count
        shell: bash
        run: |
          count=$(git ls-files 'examples/*/dist/*.zip' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one tracked examples/*/dist/*.zip, found $count"
            exit 1
          fi
