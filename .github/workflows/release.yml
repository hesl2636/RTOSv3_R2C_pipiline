name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Assert tag matches package.json version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build payload
        run: node scripts/release.mjs
      - name: Verify checksums
        run: node scripts/verify-sums.mjs dist/SHA256SUMS.txt
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "v${version}" \
            --draft \
            --title "v${version}" \
            --generate-notes \
            "dist/r2c-payload-${version}.tgz" \
            "dist/SHA256SUMS.txt"
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          R2C_PROVENANCE: ${{ vars.R2C_PROVENANCE }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" == *-rc* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          # Private/non-public repos cannot mint provenance; set the repository
          # variable R2C_PROVENANCE=1 once the repository is public.
          if [ "${R2C_PROVENANCE:-0}" = "1" ]; then
            npm publish --access public --tag "$dist_tag" --provenance
          else
            npm publish --access public --tag "$dist_tag"
          fi
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release edit "v${version}" --draft=false
