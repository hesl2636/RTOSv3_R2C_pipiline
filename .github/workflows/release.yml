name: release

on:
  push:
    tags:
      - 'bundle-*'

permissions:
  contents: write

jobs:
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Release contract check
        run: node scripts/release.mjs --check
      - name: Check the bundle release for this tag
        run: >-
          node scripts/release.mjs --bundle examples/rtosv3/dist/bundle-rtosv3-drvport-v1.0.0.zip
          --check --tag "${{ github.ref_name }}"
      - name: Publish the immutable bundle Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/release.mjs --bundle examples/rtosv3/dist/bundle-rtosv3-drvport-v1.0.0.zip
          --publish --tag "${{ github.ref_name }}" --commit "${{ github.sha }}"
