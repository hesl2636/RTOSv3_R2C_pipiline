# Rendered by `r2c adapter install dsh` at install time.
# A Cordis patch cannot see its own path, so every absolute path below is
# substituted from the installer's payload/profile context.
- id: skill-filesystem
  config:
    bundledSkillDir: '${PAYLOAD_HOME}/skills'

- insert:
    - id: r2c-dsh
      name: '${PAYLOAD_HOME}/adapters/dsh/index.mjs'
      config:
        runnerCmd: '${RUNNER_CMD}'
        projectRoot: '${PROJECT_ROOT}'
        payloadHome: '${PAYLOAD_HOME}'
        shim: '${PAYLOAD_HOME}/shims/hook.mjs'
        cap: 8
