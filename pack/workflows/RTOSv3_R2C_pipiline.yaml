    - id: step-12f584cb-5b03-4f64-a419-0089719277ea
      stage: stg-9fe1a09c-71e6-44a9-af79-5ebd9d462f53
      name: Upload Session Data
      command:
        type: shell
        command: |
          node -e "const{homedir}=require('node:os');const{join}=require('node:path');const{existsSync,readdirSync,readFileSync}=require('node:fs');const{pathToFileURL}=require('node:url');const cwd=process.cwd();const np=cwd.replace(new RegExp(String.fromCharCode(92).repeat(2),'g'),'/');const pid1=np.replace(/[^A-Za-z0-9]/g,'-');const pid2=cwd.replace(/[^a-zA-Z0-9]/g,'-').replace(/^-+|-+$/g,'');const pdir=[...new Set([pid1,pid2])].map(x=>join(homedir(),'.legacy-state','projects',x)).find(d=>existsSync(join(d,'runs')))||join(homedir(),'.legacy-state','projects',pid1);const runsDir=join(pdir,'runs');let engineName='';try{for(const r of readdirSync(runsDir).filter(e=>e.startsWith('R')).sort().reverse()){const sp=join(runsDir,r,'state.json');if(existsSync(sp)){const st=JSON.parse(readFileSync(sp,'utf-8'));if(st.workflow_engine){engineName=st.workflow_engine;break}}}}catch(e){}const b=join(homedir(),'.legacy-state','plugins','marketplaces');let found='';let fuzzyFound='';try{for(const m of readdirSync(b))for(const p of readdirSync(join(b,m))){const pp=join(b,m,p);if(existsSync(join(pp,'scripts','upload-session.mjs'))){if(engineName&&p===engineName){found=pp;break}if(engineName&&(p.includes(engineName)||engineName.includes(p))){fuzzyFound=fuzzyFound||pp}}}}catch(e){}if(!found&&fuzzyFound){found=fuzzyFound}if(!found){for(const m of readdirSync(b))for(const p of readdirSync(join(b,m))){const pp=join(b,m,p);if(existsSync(join(pp,'scripts','upload-session.mjs'))){found=pp;break}}}if(!found){console.error('upload: plugin root not found');process.exit(0)}import(pathToFileURL(join(found,'scripts','upload-session.mjs')).href)"
      timeout: 300
    - id: step-3e67d76a-06b3-45dc-88c5-34ddc35c3e70
      stage: stg-871cbd1f-022e-4b2c-b47e-35103e991a66
      name: Analyze Session
      command:
        type: shell
        command: |
          node -e "const{homedir}=require('node:os');const{join}=require('node:path');const{existsSync,readdirSync,readFileSync}=require('node:fs');const{pathToFileURL}=require('node:url');const cwd=process.cwd();const np=cwd.replace(new RegExp(String.fromCharCode(92).repeat(2),'g'),'/');const pid1=np.replace(/[^A-Za-z0-9]/g,'-');const pid2=cwd.replace(/[^a-zA-Z0-9]/g,'-').replace(/^-+|-+$/g,'');const pdir=[...new Set([pid1,pid2])].map(x=>join(homedir(),'.legacy-state','projects',x)).find(d=>existsSync(join(d,'runs')))||join(homedir(),'.legacy-state','projects',pid1);const runsDir=join(pdir,'runs');let engineName='';try{for(const r of readdirSync(runsDir).filter(e=>e.startsWith('R')).sort().reverse()){const sp=join(runsDir,r,'state.json');if(existsSync(sp)){const st=JSON.parse(readFileSync(sp,'utf-8'));if(st.workflow_engine){engineName=st.workflow_engine;break}}}}catch(e){}const b=join(homedir(),'.legacy-state','plugins','marketplaces');let found='';try{for(const m of readdirSync(b))for(const p of readdirSync(join(b,m))){const pp=join(b,m,p);if(existsSync(join(pp,'scripts','analyze-session.mjs'))){if(!engineName||p===engineName){found=pp;break}}}}catch(e){}if(!found){for(const m of readdirSync(b))for(const p of readdirSync(join(b,m))){const pp=join(b,m,p);if(existsSync(join(pp,'scripts','analyze-session.mjs'))){found=pp;break}}}if(!found){console.error('analysis: plugin root not found');process.exit(0)}import(pathToFileURL(join(found,'scripts','analyze-session.mjs')).href)"
      timeout: 1800
